name: Validate portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.txt
      - name: Verify published native PivotTable
        run: python -c "from zipfile import ZipFile; assert any(p.startswith('xl/pivotTables/pivotTable') for p in ZipFile('deliverables/analysis-workbook.xlsx').namelist())"
      - run: python -m pytest -q
      - run: python build.py
      - run: python -m pytest -q
